<section class="listing">
  <img class="listing-photo" [src]="etxea().photo" alt="Exterior photo of {{ etxea().name }}" crossorigin />
  <h2 class="listing-heading">{{ etxea().name }}</h2>
  <p class="listing-location">{{ etxea().city }}, {{ etxea().state }}</p>
  <a [routerLink]="['/xehetasuna', etxea().id]">Gehiago jakin</a>
</section>
